<!doctype html>
<html lang="en" class="mx">

<head>
  <!-- Tema scuro applicato prima di tutto: niente flash bianco -->
  <script>try{if(localStorage.getItem("night")==="true")document.documentElement.classList.add("dark")}catch(e){}</script>
  <!-- Indirizzi senza .html (es. /curriculum): toglie l'estensione da vecchi link e preferiti -->
  <script>(function(){try{var p=location.pathname;if(/\.html$/.test(p))history.replaceState(null,"",p.replace(/(^|\/)index\.html$/,"$1").replace(/\.html$/,"")+location.search+location.hash)}catch(e){}})()</script>
  <!-- Chrome aspetta a disegnare la pagina fino a quando le parti comuni sono inserite -->
  <link rel="expect" href="#mx-partials" blocking="render">

  <title>FGh.io - Blog</title>

  <link rel="shortcut icon" href="assets/images/logo.ico">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Anteprima nei motori di ricerca e quando il link viene condiviso -->
  <meta name="description" content="A blog post by Federico Ghioldi.">
  <meta name="author" content="Federico Ghioldi">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="FGh.io">
  <meta property="og:title" content="Blog post | Federico Ghioldi">
  <meta property="og:description" content="A blog post by Federico Ghioldi.">
  <meta property="og:image" content="https://fghio.github.io/assets/images/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="assets/css/default.css">
  <link rel="stylesheet" href="assets/css/modern.css">
  <script src="assets/js/jquery-3.7.1.min.js"></script>
  <script src="assets/js/partials.js"></script>
  <script src="assets/js/router.js" defer></script>
  <script src="assets/js/search.js" defer></script>
  

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous">
  
</head>


<body class="is-3-column light">

  <!-- NAVIGATION BAR -->
  <div id="navBarContainer"></div>
  
  <section class=section style="opacity: 1;">

    <div class="container">
      <div class="columns">

        <!-- CENTRAL PANE -->
        <div class="column order-2 column-main is-8-tablet is-8-desktop is-9-widescreen">
          <script>
          $(document).ready(function () {

            // This code should be placed here
            const urlParams = new URLSearchParams(window.location.search);
            const postTitle = urlParams.get('post');
            if (postTitle) {
              // Fetch the content of the blog post based on postTitle
              $.ajax({
                url: `./posts/blog/${postTitle}.html`, // Adjust the path as needed
                success: function (postContent) {
                  // Display the postContent in the central pane of the blogPost.html page
                  $('.column-main').html(postContent);
                  // titolo della scheda (e per Google) = titolo del post
                  var h = $('.column-main h1.title').first().text().replace(/\s+/g, ' ').trim();
                  if (h) document.title = h + ' - FGh.io';
                },
                error: function () { mxNotFound(); }   // post inesistente
              });
            } else {
              mxNotFound();   // nessun post indicato
            }
          });
          </script>
        </div>

        <!-- LEFT PANE -->
        <div class="column column-left is-4-tablet is-4-desktop is-3-widescreen order-1 is-sticky">
        
          <div id="leftPaneContainer"></div>
          
          <div class="card" id="my-table-content" style="margin-top: 20px;">
            <div class="card-content">
              <div class="menu">
                <h3 class="menu-label">Table of content</h3>
                <ul class="menu-list">
                  <div id="table-of-contents"></div>
                </ul>
              </div>
            </div>
          </div>
         
        </div>
      </div>
    </div>

    <a id="back-to-top" 
      title="Back to top" 
      href="javascript:void(0);" 
      style="right: 150px; bottom: 35px; width: 50px;" 
      class="card has-text-centered">
      <i class="fas fa-chevron-up"></i>
    </a>

  </section>

  <!-- FOOTER -->
  <div id="footerContainer"></div>

  <!-- Parti comuni: inserite subito (dalla cache se disponibile) -->
  <script id="mx-partials">
    loadPartial("#navBarContainer", "./common/navBar.html");
    loadPartial("#leftPaneContainer", "./common/leftPane.html");
    loadPartial("#footerContainer", "./common/footer.html");
  </script>

  <script src="./assets/js/back-to-top.js"></script>
  <script src="./assets/js/script.js"></script>
  <script src="./assets/js/main.js"></script>
  <script src="./assets/js/columns.js"></script>

</body>

</html>
