<!DOCTYPE html>
<html lang="en" class="mx">

<head>
  <!-- Tema scuro applicato prima di tutto: niente flash bianco -->
  <script>try{if(localStorage.getItem("night")==="true")document.documentElement.classList.add("dark")}catch(e){}</script>
  <!-- Indirizzi senza .html (es. /curriculum): toglie l'estensione da vecchi link e preferiti -->
  <script>(function(){try{var p=location.pathname;if(/\.html$/.test(p))history.replaceState(null,"",p.replace(/(^|\/)index\.html$/,"$1").replace(/\.html$/,"")+location.search+location.hash)}catch(e){}})()</script>
  <!-- Chrome aspetta a disegnare la pagina fino a quando le parti comuni sono inserite -->
  <link rel="expect" href="#mx-partials" blocking="render">

  <title>FGh.io - Home</title>

  <link rel="shortcut icon" href="assets/images/logo.ico">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/default.css">
  <link rel="stylesheet" href="assets/css/modern.css">
  <script src="assets/js/jquery-3.7.1.min.js"></script>
  <script src="assets/js/partials.js"></script>
  <script src="assets/js/search.js" defer></script>

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.2/css/all.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;600&amp;family=PT+Sans+Narrow:wght@400;700&amp;family=PT+Serif">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    crossorigin="anonymous">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cookieconsent@3.1.1/build/cookieconsent.min.css">

</head>

<body class="pace-done is-3-column light" data-new-gr-c-s-check-loaded="14.1134.0" data-gr-ext-installed>

  <div class="pace pace-inactive">
    <div class="pace-progress" data-progress-text="100%" data-progress="100"
      style="transform: translate3d(100%, 0px, 0px);">
      <div class="pace-progress-inner"></div>
    </div>
    <div class="pace-activity"></div>
  </div>

  <!-- NAVIGATION BAR -->
  <div id="navBarContainer"></div>

  <section class="section" style="opacity: 1;">

    <div class="container">
      <div class="columns">

        <!-- CENTRAL PANE -->
        <div class="column order-2 column-main is-8-tablet is-8-desktop is-6-widescreen">
          <div id="homePaneContainer"></div>
        </div>

        <!-- LEFT PANE -->
        <div class="column column-left is-4-tablet is-4-desktop is-3-widescreen order-1">
          <div id="leftPaneContainer"></div>
        </div>

        <!-- RIGHT PANE -->
        <div class="column column-right is-4-tablet is-4-desktop is-3-widescreen order-3">
          <div id="rightPaneContainer"></div>
        </div>

      </div>
    </div>

    <a id="back-to-top" title="Back to top" href="javascript:void(0);" style="right: 500px; bottom: 35px; width: 50px;"
      class="card has-text-centered">
      <i class="fas fa-chevron-up"></i>
    </a>

  </section>


  <!-- FOOTER -->
  <div id="footerContainer"></div>

  <!-- Parti comuni: inserite subito (dalla cache se disponibile) -->
  <script id="mx-partials">
    loadPartial("#navBarContainer", "./common/navBar.html");
    loadPartial("#leftPaneContainer", "./common/leftPane.html");
    loadPartial("#rightPaneContainer", "./common/rightPane.html");
    loadPartial("#footerContainer", "./common/footer.html");
  </script>

  <script src="assets/js/columns.js"></script>
  <script src="./assets/js/back-to-top.js"></script>
  <script src="./assets/js/script.js"></script>
  <script src="./assets/js/main.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/cookieconsent@3.1.1/build/cookieconsent.min.js" defer=""></script>

  <script>
    window.addEventListener("load", () => {
      window.cookieconsent.initialise({
        type: "info",
        theme: "edgeless",
        static: false,
        position: "bottom-left",
        content: {
          message: "Cookies collected just to remember which mode (light/dark) you prefer.",
          dismiss: "Got it!",
          allow: "Allow cookies",
          deny: "Decline",
          link: "Learn more",
          policy: "Cookie Policy",
          href: "https://www.cookiesandyou.com/",
        },
        palette: {
          popup: {
            background: "#edeff5",
            text: "#838391"
          },
          button: {
            background: "#4b81e8"
          },
        },
      });
    });

    $(function () {
      // Load content dynamically
      $("#homePaneContainer").load("homePane.html");
    });
  </script>

</body>

</html>
