<!doctype html>
<html lang="en" class="mx">

<head>
  <!-- Tema scuro applicato prima di tutto: niente flash bianco -->
  <script>try{if(localStorage.getItem("night")==="true")document.documentElement.classList.add("dark")}catch(e){}</script>
  <!-- Indirizzi senza .html (es. /curriculum): toglie l'estensione da vecchi link e preferiti -->
  <script>(function(){try{var p=location.pathname;if(/\.html$/.test(p))history.replaceState(null,"",p.replace(/(^|\/)index\.html$/,"$1").replace(/\.html$/,"")+location.search+location.hash)}catch(e){}})()</script>
  <!-- Chrome aspetta a disegnare la pagina fino a quando le parti comuni sono inserite -->
  <link rel="expect" href="#mx-partials" blocking="render">

  <title>FGh.io - Projects</title>

  <link rel="shortcut icon" href="assets/images/logo.ico">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Anteprima nei motori di ricerca e quando il link viene condiviso -->
  <meta name="description" content="A project by Federico Ghioldi.">
  <meta name="author" content="Federico Ghioldi">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FGh.io">
  <meta property="og:title" content="Project | Federico Ghioldi">
  <meta property="og:description" content="A project by Federico Ghioldi.">
  <meta property="og:image" content="https://fghio.github.io/assets/images/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="assets/css/default.css">
  <link rel="stylesheet" href="assets/css/modern.css">
  <script src="assets/js/jquery-3.7.1.min.js"></script>
  <script src="assets/js/partials.js"></script>
  <script src="assets/js/router.js" defer></script>
  <script src="assets/js/pflock.js"></script>
  <script src="assets/js/search.js" defer></script>
  

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous">
  
</head>


<body class="pace-done is-3-column light" 
  data-new-gr-c-s-check-loaded="14.1134.0" data-gr-ext-installed>

  <div class="pace pace-inactive">
    <div class="pace-progress" data-progress-text="100%" data-progress="100" style="transform: translate3d(100%, 0px, 0px);">
      <div class="pace-progress-inner"></div>
    </div>
    <div class="pace-activity"></div>
  </div>

  <!-- NAVIGATION BAR -->
  <div id="navBarContainer"></div>
  
  <section class=section style="opacity: 1;">

    <div class="container">
      <div class="columns">

        <!-- CENTRAL PANE -->
        <div class="column order-2 column-main is-8-tablet is-8-desktop is-6-widescreen">
          <div id="projects-preview">

            <div class="card">
              <article class="card-content article" role="article">
                <div id="content">
		              <script>
		                // Function to get the value of a query parameter from the URL
		                function getQueryParam(parameter) {
		                  var urlParams = new URLSearchParams(window.location.search);
		                  return urlParams.get(parameter);
		                }

		                // Function to update the content based on the card ID
		                function updateContent(cardId) {
		                  var contentDiv = document.getElementById('content');
		                  if (contentDiv) {
		                    if (cardId === 'PF') {
    		                  // progetto protetto da password (contenuto cifrato)
    		                  PFLock.mount(contentDiv, "./posts/projects/spreadsheet.enc");
		                    } else if (cardId === 'WEB') {
    		                  contentDiv.innerHTML = "<div data-include='./posts/projects/website'></div>";
		                    } else if (cardId === 'OF') {
    		                  contentDiv.innerHTML = "<div data-include='./posts/projects/CFDcourse'></div>";
		                    } else if (cardId === 'PJ') {
    		                  contentDiv.innerHTML = "<div data-include='./posts/projects/projet'></div>";
		                    } else {
    		                  // progetto inesistente: scheda della 404 (a pagina caricata)
    		                  $(function () { mxNotFound(); });
		                    }
		                  }
		                }

		                // Get the card ID from the query parameter and update the content
		                var cardId = getQueryParam('id');
		                updateContent(cardId);
		              </script>
                            
                </div>

              </article>
            </div>

          </div>
        </div>

        <!-- LEFT PANE -->
        <div class="column column-left is-4-tablet is-4-desktop is-3-widescreen order-1">
          <div id="leftPaneContainer"></div>

          <div id="donate"></div>
          
        </div>

        <!-- RIGHT PANE -->
        <div class="column column-right is-4-tablet is-4-desktop is-3-widescreen order-3">
          <div id="rightPaneContainer"></div>
        </div>

      </div>
    </div>

    <a id="back-to-top" 
      title="Back to top" 
      href="javascript:void(0);" 
      style="right: 500px; bottom: 35px; width: 50px;" 
      class="card has-text-centered">
      <i class="fas fa-chevron-up"></i>
    </a>

  </section>

  <!-- FOOTER -->
  <div id="footerContainer"></div>

  <!-- Parti comuni: inserite subito (dalla cache se disponibile) -->
  <script id="mx-partials">
    loadPartial("#navBarContainer", "./common/navBar.html");
    loadPartial("#leftPaneContainer", "./common/leftPane.html");
    loadPartial("#rightPaneContainer", "./common/rightPane.html");
    loadPartial("#footerContainer", "./common/footer.html");
  </script>

  <script src="./assets/js/back-to-top.js"></script>
  <script src="./assets/js/script.js"></script>
  <script src="./assets/js/main.js"></script>
  <script src="./assets/js/blogCard.js"></script>
  <script src="./assets/js/columns.js"></script>

  <script>
    $(function () {
      // Load content dynamically
      $("#donate").load("./common/donate.html");
    });
  </script>
  
</body>

<script>
  $(function () {
    var includes = $('[data-include]')
    $.each(includes, function() {
      var file = $(this).data('include')
      $(this).load(file+".html")
    })
  })
</script>

</html>
